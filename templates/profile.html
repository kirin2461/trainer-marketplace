{% extends "base.html" %}
{% block title %}Профиль — ClimbConnect{% endblock %}
{% block content %}
<div class="container">
    <div style="max-width: 600px; margin: 0 auto;">
        <h1 style="font-size: var(--text-3xl); font-weight: 800; margin-bottom: var(--space-lg);">Мой профиль</h1>
        
        <div class="main-panel" style="margin-bottom: var(--space-xl);">
            <form id="profileForm" onsubmit="updateProfile(event)">
                <div style="display: grid; gap: var(--space-md);">
                    <div>
                        <label style="display: block; margin-bottom: var(--space-xs); color: var(--text-secondary); font-size: 0.875rem;">Имя</label>
                        <input type="text" name="name" value="{{ user.name }}" style="width: 100%; padding: var(--space-sm); background: var(--bg-primary); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text-primary);" required>
                    </div>
                    <div>
                        <label style="display: block; margin-bottom: var(--space-xs); color: var(--text-secondary); font-size: 0.875rem;">Email</label>
                        <input type="email" value="{{ user.email }}" disabled style="width: 100%; padding: var(--space-sm); background: var(--bg-secondary); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text-muted);">
                    </div>
                    <div>
                        <label style="display: block; margin-bottom: var(--space-xs); color: var(--text-secondary); font-size: 0.875rem;">Телефон</label>
                        <input type="tel" name="phone" value="{{ user.phone or '' }}" style="width: 100%; padding: var(--space-sm); background: var(--bg-primary); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text-primary);">
                    </div>
                    <div>
                        <label style="display: block; margin-bottom: var(--space-xs); color: var(--text-secondary); font-size: 0.875rem;">О себе</label>
                        <textarea name="bio" rows="4" style="width: 100%; padding: var(--space-sm); background: var(--bg-primary); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text-primary); resize: vertical;">{{ user.bio or '' }}</textarea>
                    </div>
                    <div>
                        <label style="display: block; margin-bottom: var(--space-xs); color: var(--text-secondary); font-size: 0.875rem;">Город</label>
                        <input type="text" name="location" value="{{ user.location or '' }}" style="width: 100%; padding: var(--space-sm); background: var(--bg-primary); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text-primary);">
                    </div>
                    {% if user.role == 'client' %}
                    <div>
                        <label style="display: block; margin-bottom: var(--space-xs); color: var(--text-secondary); font-size: 0.875rem;">Цель</label>
                        <select name="fitness_goal" style="width: 100%; padding: var(--space-sm); background: var(--bg-primary); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text-primary);">
                            <option value="">Выберите цель</option>
                            {% for key, g in GOALS.items() %}
                            <option value="{{ key }}" {% if user.fitness_goal == key %}selected{% endif %}>{{ g }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div>
                        <label style="display: block; margin-bottom: var(--space-xs); color: var(--text-secondary); font-size: 0.875rem;">Любимая дисциплина</label>
                        <select name="preferred_sport" style="width: 100%; padding: var(--space-sm); background: var(--bg-primary); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text-primary);">
                            <option value="">Любая</option>
                            {% for key, d in DISCIPLINES.items() %}
                            <option value="{{ key }}" {% if user.preferred_sport == key %}selected{% endif %}>{{ d.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    {% endif %}
                </div>
                <button type="submit" class="btn btn-primary" style="margin-top: var(--space-lg); width: 100%;">Сохранить изменения</button>
            </form>
        </div>
    </div>
</div>
<script>
async function updateProfile(e) {
    e.preventDefault();
    const form = new FormData(e.target);
    const res = await fetch('/api/profile', {method: 'POST', body: form});
    const data = await res.json();
    if (data.success) { alert('Профиль обновлен!'); location.reload(); }
    else alert('Ошибка: ' + (data.detail || 'Не удалось обновить'));
}
</script>
{% endblock %}
